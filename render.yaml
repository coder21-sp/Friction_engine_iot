services:
  - type: web
    name: hfme-ai-service
    runtime: python
    plan: free
    buildCommand: pip install -r ai-service/requirements.txt
    startCommand: cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_INTERNAL_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health

  - type: web
    name: hfme-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: hfme-ai-service
          property: host
      - key: AI_INTERNAL_API_KEY
        fromService:
          type: web
          name: hfme-ai-service
          envVarKey: AI_INTERNAL_API_KEY
